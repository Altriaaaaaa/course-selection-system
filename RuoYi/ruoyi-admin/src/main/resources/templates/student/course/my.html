<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('我的选课')" /></head>
<style>
.quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}
.quick-actions .action-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: #fff;
    border: 1px solid #e7eaec;
    border-radius: 8px;
    text-decoration: none;
    color: #2f4050;
    transition: all 0.2s ease;
}
.quick-actions .action-card:hover {
    border-color: #1ab394;
    box-shadow: 0 2px 8px rgba(26,179,148,0.12);
    text-decoration: none;
    color: #1ab394;
}
.quick-actions .action-card .action-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
}
.quick-actions .action-card .action-text {
    font-size: 13px;
    font-weight: 500;
}
.icon-green { background-color: #1ab394; }
.icon-blue { background-color: #1c84c6; }
.icon-orange { background-color: #f8ac59; }
.icon-purple { background-color: #9b59b6; }
</style>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12" style="margin-bottom:15px">
            <a class="btn btn-primary" th:href="@{/student/index(sno=${sno})}"><i class="fa fa-arrow-left"></i> 返回首页</a>
        </div>
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5><i class="fa fa-check-circle" style="color:#1ab394;margin-right:8px;"></i>我的选课</h5>
                </div>
                <div class="ibox-content">
                    <div class="quick-actions">
                        <a class="action-card" th:href="@{/student/schedule(sno=${sno})}">
                            <span class="action-icon icon-purple"><i class="fa fa-calendar"></i></span>
                            <span class="action-text">我的课表</span>
                        </a>
                        <a class="action-card" th:href="@{/student/grade(sno=${sno})}">
                            <span class="action-icon icon-orange"><i class="fa fa-file-text-o"></i></span>
                            <span class="action-text">成绩查询</span>
                        </a>
                        <a class="action-card" th:href="@{/student/course(sno=${sno})}">
                            <span class="action-icon icon-blue"><i class="fa fa-search"></i></span>
                            <span class="action-text">可选课程</span>
                        </a>
                        <a class="action-card" th:href="@{/student/exam(sno=${sno})}">
                            <span class="action-icon icon-green"><i class="fa fa-clock-o"></i></span>
                            <span class="action-text">考试时间</span>
                        </a>
                    </div>
                    <table id="bootstrap-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
var sno = [[${sno}]];
$(function() {
    var options = {
        url: ctx + "student/course/my/list",
        createUrl: undefined, updateUrl: undefined, removeUrl: undefined,
        modalName: "选课", uniqueId: "cno",
        queryParams: function(params) { return {pageSize: params.limit, pageNum: params.offset / params.limit + 1, sno: sno}; },
        columns: [{field:'cno',title:'课程号'},{field:'cname',title:'课程名'},{field:'semester',title:'学期'},{field:'normalScore',title:'平时成绩'},{field:'testScore',title:'考试成绩'},{title:'操作',formatter:function(v,r){return '<a class="btn btn-danger btn-xs" href="#" onclick="dropCourse(\''+r.cno+'\')">退课</a>';}}]
    };
    $.table.init(options);
});
function dropCourse(cno) {
    $.modal.confirm("确定要退选该课程吗？", function() {
        $.ajax({ type: "POST", url: ctx + "student/course/drop", data: {sno:sno, cno:cno}, success: function(r) { if (r.code == web_status.SUCCESS) { $.modal.msgSuccess(r.msg); $.table.refresh(); } else { $.modal.alertError(r.msg); } } });
    });
}
</script></body></html>
