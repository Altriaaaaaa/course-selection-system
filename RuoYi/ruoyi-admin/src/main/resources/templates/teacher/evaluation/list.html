<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('学生评价')" /></head>
<body class="gray-bg">
<style>
.star-rating {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-size: 14px;
}
.star-rating .star-filled {
    color: #f8ac59;
}
.star-rating .star-empty {
    color: #dce1e7;
}
.star-rating .rating-num {
    margin-left: 6px;
    font-weight: 600;
    color: var(--secondary);
    font-size: 13px;
}
</style>
<div class="container-div">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5><i class="fa fa-star"></i> 学生评价</h5>
                </div>
                <div class="ibox-content">
                    <div class="select-table table-striped">
                        <table id="bootstrap-table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">var ctx=[[@{/}]];
$(function(){
  $.table.init({url:ctx+"teacher/evaluation/list",createUrl:undefined,updateUrl:undefined,removeUrl:undefined,modalName:"评价统计",
    columns:[{field:"cname",title:"课程"},{field:"avgRating",title:"平均评分",formatter:function(v){var s='<span class=\"star-rating\">';var n=Math.round(v||0);for(var i=0;i<5;i++){s+=i<n?'<i class=\"fa fa-star star-filled\"></i>':'<i class=\"fa fa-star star-empty\"></i>';}s+='<span class=\"rating-num\">'+(v?v.toFixed(1):'-')+'</span></span>';return s;}},
      {field:"evalCount",title:"评价人数"},{field:"recentComments",title:"近期评价"}]});
});
</script></body></html>
