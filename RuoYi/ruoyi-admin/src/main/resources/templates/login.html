<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>登录若依系统</title>
    <meta name="description" content="若依后台管理框架">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <link href="../static/ruoyi/css/ry-ui.css" th:href="@{/ruoyi/css/ry-ui.css?v=4.8.3}" rel="stylesheet"/>
    <!-- 360浏览器急速模式 -->
    <meta name="renderer" content="webkit">
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="../static/favicon.ico" th:href="@{favicon.ico}"/>
    <style type="text/css">
        :root {
            --primary: #1ab394;
            --primary-dark: #18a689;
            --secondary: #2f4050;
            --danger: #ed5565;
            --border-color: #e7eaec;
            --bg-gray: #f5f7fa;
        }
        body.signin {
            background-color: var(--bg-gray);
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        .signinpanel {
            max-width: 900px;
            margin: 8vh auto;
            padding: 0;
        }
        .signinpanel .row {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .signin-info {
            background-color: var(--secondary);
            color: #fff;
            padding: 48px 40px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .signin-info .logopanel {
            margin-bottom: 24px;
        }
        .signin-info .logopanel h1 img {
            max-height: 50px;
        }
        .signin-info h4 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }
        .signin-info ul {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }
        .signin-info ul li {
            padding: 6px 0;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }
        .signin-info ul li i {
            color: var(--primary);
            margin-right: 10px;
            width: 16px;
            text-align: center;
        }
        .signin-info strong a {
            color: var(--primary);
        }
        .col-sm-5 {
            padding: 48px 40px;
        }
        .col-sm-5 h4.no-margins {
            font-size: 22px;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 6px;
        }
        .col-sm-5 .m-t-md {
            color: #a7aeb8;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .col-sm-5 .form-control {
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 16px;
            height: auto;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .col-sm-5 .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,179,148,0.15);
            outline: none;
        }
        .col-sm-5 .form-control::placeholder {
            color: #a7aeb8;
        }
        .col-sm-5 .code {
            margin-bottom: 0;
        }
        .col-sm-5 .imgcode {
            border-radius: 6px;
            cursor: pointer;
            margin-top: 2px;
        }
        .checkbox-custom {
            margin-top: 16px;
            margin-bottom: 20px;
        }
        .checkbox-custom label {
            color: #676a6c;
            font-size: 13px;
            font-weight: 400;
        }
        .btn-success.btn-block {
            background-color: var(--primary);
            border-color: var(--primary);
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            transition: background-color 0.2s ease;
        }
        .btn-success.btn-block:hover,
        .btn-success.btn-block:focus {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .signup-footer {
            text-align: center;
            padding: 20px 0 0;
            color: #a7aeb8;
            font-size: 12px;
        }
        .signup-footer .pull-left {
            text-align: center;
            float: none !important;
        }
        label.error {
            position: inherit;
            color: var(--danger);
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 12px;
        }
    </style>
    <script>
        if(window.top!==window.self){alert('未登录或登录超时。请重新登录');window.top.location=window.location};
    </script>
</head>
<body class="signin">
    <div class="signinpanel">
        <div class="row">
            <div class="col-sm-7">
                <div class="signin-info">
                    <div class="logopanel m-b">
                        <h1><img alt="[ 若依 ]" src="../static/ruoyi.png" th:src="@{/ruoyi.png}"></h1>
                    </div>
                    <div class="m-b"></div>
                    <h4>欢迎使用 <strong>若依 后台管理系统</strong></h4>
                    <ul class="m-b">
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> SpringBoot</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Mybatis</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Shiro</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Thymeleaf</li>
                        <li><i class="fa fa-arrow-circle-o-right m-r-xs"></i> Bootstrap</li>
                    </ul>
                    <strong th:if="${isAllowRegister}">还没有账号？ <a th:href="@{/register}">立即注册&raquo;</a></strong>
                </div>
            </div>
            <div class="col-sm-5">
                <form id="signupForm" autocomplete="off">
                    <h4 class="no-margins">登录：</h4>
                    <p class="m-t-md">你若不离不弃，我必生死相依</p>
                    <input type="text"     name="username" class="form-control uname"     placeholder="用户名" value="admin"    />
                    <input type="password" name="password" class="form-control pword"     placeholder="密码"   value="admin123" />
					<div class="row m-t" th:if="${captchaEnabled==true}">
						<div class="col-xs-6">
						    <input type="text" name="validateCode" class="form-control code" placeholder="验证码" maxlength="5" />
						</div>
						<div class="col-xs-6">
							<a href="javascript:void(0);" title="点击更换验证码">
								<img th:src="@{/captcha/captchaImage(type=${captchaType})}" class="imgcode" width="85%"/>
							</a>
						</div>
					</div>
                    <div class="checkbox-custom" th:if="${isRemembered}" th:classappend="${captchaEnabled==false} ? 'm-t'">
				        <input type="checkbox" id="rememberme" name="rememberme"> <label for="rememberme">记住我</label>
				    </div>
                    <button class="btn btn-success btn-block" id="btnSubmit" data-loading="正在验证登录，请稍候...">登录</button>
                </form>
            </div>
        </div>
        <div class="signup-footer">
            <div class="pull-left">
                Copyright © 2018-2026 ruoyi.vip All Rights Reserved. <br>
            </div>
        </div>
    </div>
<script th:inline="javascript"> var ctx = [[@{/}]]; var captchaType = [[${captchaType}]]; var captchaEnabled = [[${captchaEnabled}]];</script>
<!--[if lte IE 8]><script>window.location.href=ctx+'html/ie.html';</script><![endif]-->
<!-- 全局js -->
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
<script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script src="../static/ruoyi/js/ry-ui.js" th:src="@{/ruoyi/js/ry-ui.js?v=4.8.3}"></script>
<script src="../static/ruoyi/login.js" th:src="@{/ruoyi/login.js}"></script>
</body>
</html>
