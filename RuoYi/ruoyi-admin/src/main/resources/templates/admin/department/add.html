<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增院系')" />
    <style>
        .form-group { margin-bottom: 20px; }
        .form-control {
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(26,179,148,0.15);
        }
        .control-label { font-weight: 500; color: var(--secondary); }
    </style>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-department-add">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">院系名称：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="deptName" id="deptName" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">地址：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="address">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">电话：</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="phoneCode">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "admin/department";

        $("#form-department-add").validate({
            onkeyup: false,
            rules: {
                deptName: {
                    remote: {
                        url: ctx + "admin/department/checkDeptNameUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            "deptName": function() {
                                return $.common.trim($("#deptName").val());
                            }
                        }
                    }
                }
            },
            messages: {
                "deptName": {
                    remote: "院系名称已经存在"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-department-add').serialize());
            }
        }
    </script>
</body>
</html>
